# GitHub Actions: Windows 发版（fork 定制）
#
# 触发条件：推送 v* tag（如 v0.17.201）
#
# 为什么单独一个文件而不是改上游的 release.yml：
# - 上游会持续维护 release.yml，改动它会让每次合并上游都产生冲突；
# - 上游的 mac job 需要 Apple 签名/公证 secrets，本 fork 没有配，跑了必然失败。
#
# 本 fork 与上游 release.yml 的触发条件相同（都是 v*），靠**仓库设置**把上游那个
# workflow 禁用（gh workflow disable release.yml / Actions 页面手动禁用），
# 而不是改它的文件内容 —— 禁用状态记录在 GitHub 侧，因此该文件可保持与上游一致、
# 永不冲突。若上游新增了别的 workflow，注意它们默认是启用的。
#
# tag 与 Release 保持同名：electron-builder 按 `v${version}` 创建/复用 Release，
# 所以触发 tag 用 v* 时，触发 tag 与产物 Release 的 tag 是同一个。
#
# GITHUB_TOKEN 由 GitHub Actions 自动提供。产物发布到 electron-builder.yml
# 的 publish 配置所指仓库（已改为本 fork），releaseType 为 release（非草稿）。

name: Release (Windows)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: build (windows-latest, win, x64, --x64)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      # Bun workspace 把依赖 hoist 到仓库根 node_modules，而 electron-builder 的
      # files 规则以 apps/electron 为 appDir。不同步的话 apps/electron/node_modules
      # 是空的，打出来的包里会缺 Pi runtime 等 external 依赖。
      # 上游 release.yml 的 win job 没有这一步，本 fork 显式补上。
      - name: 同步运行时依赖
        run: bun run sync:runtime-deps
        working-directory: apps/electron

      - name: 打包并发布 (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always
        working-directory: apps/electron

      # electron-builder 创建的 Release body 是空的，而应用内「版本历史」读的正是
      # 这个字段（ReleaseNotesViewer 渲染 release.body），空 body 会显示
      # 「暂无发布说明」。这里把仓库内的 release-notes/v<version>.md 写进 Release。
      # 找不到对应文件只告警、不让发版失败。
      - name: 写入发布说明
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NOTES="../../release-notes/v${VERSION}.md"
          if [ -f "$NOTES" ]; then
            gh release edit "v${VERSION}" --repo "${{ github.repository }}" --notes-file "$NOTES"
            echo "已写入发布说明: $NOTES"
          else
            echo "::warning::未找到 $NOTES，Release 说明将保持为空（应用内会显示「暂无发布说明」）"
          fi
        working-directory: apps/electron
